    </text>
    <!-- FITNESS COURT -->
    <text x="2" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#EAB308" letter-spacing="6">
      FITNESS COURT
    </text>
    <!-- Location Tag -->
    <text x="180" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10.5" fill="#9CA3AF" letter-spacing="2">
      • BESA, NAGPUR
    </text>
