<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <!-- Nexus Hexagon Symbol -->
  <g transform="translate(10, 10)">
    <!-- Hexagon Frame -->
    <path d="M40 4 L74 23 L74 61 L40 80 L6 61 L6 23 Z" stroke="#EAB308" stroke-width="3.5" fill="#14151B" stroke-linejoin="round" />
    <path d="M40 10 L68 26 L68 58 L40 74 L12 58 L12 26 Z" stroke="rgba(234, 179, 8, 0.3)" stroke-width="1.5" fill="none" stroke-linejoin="round" />
    
    <!-- Stylized Dynamic 'N' with Barbell/Power Energy -->
    <path d="M24 60 L24 24 L34 24 L48 50 L48 24 L56 24 L56 60 L46 60 L32 34 L32 60 Z" fill="#FFFFFF" />
    <!-- Gold Slash / Energy Bolt -->
    <path d="M30 38 L48 64 L54 64 L36 38 Z" fill="#EAB308" />
    <!-- Barbell Accents -->
    <circle cx="20" cy="42" r="3" fill="#EAB308" />
    <circle cx="60" cy="42" r="3" fill="#EAB308" />
  </g>

  <!-- Typography -->
  <g transform="translate(105, 0)">
    <!-- NEXUS -->
    <text x="0" y="48" font-family="'Space Grotesk', 'Impact', sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" letter-spacing="4">
